<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Infra Dashboard</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232a78d6'/%3E%3Crect x='8' y='8' width='16' height='5' rx='1.5' fill='white'/%3E%3Crect x='8' y='15' width='16' height='5' rx='1.5' fill='white' opacity='.75'/%3E%3Ccircle cx='11' cy='25' r='2' fill='white'/%3E%3C/svg%3E">
<style>
:root {
  color-scheme: light;
  --page: #f4f4f1; --surface: #fcfcfb; --surface-2: #f3f3ef; --raised: #ffffff;
  --ink: #0b0b0b; --ink2: #4a4945; --muted: #6e6c66;
  --grid: #e1e0d9; --axis: #c3c2b7; --border: rgba(11,11,11,.10); --border-strong: rgba(11,11,11,.18);
  --land: #e4e3dc; --land-stroke: #d0cfc6; --sea: #eef2f6;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a;
  --accent: #2a78d6; --accent-ink: #1c5cab; --accent-soft: #e3eefb;
  --good: #0ca30c; --good-ink: #006300; --warn: #fab219; --serious: #ec835a; --crit: #d03b3b;
  --crit-soft: #fbe9e9; --warn-soft: #fdf3dc; --good-soft: #e5f5e5;
  --shadow: 0 1px 2px rgba(0,0,0,.04), 0 2px 8px rgba(0,0,0,.04);
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19; --surface-2: #222220; --raised: #242422;
    --ink: #f0efec; --ink2: #c3c2b7; --muted: #9c9a92;
    --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,.10); --border-strong: rgba(255,255,255,.18);
    --land: #2e2e2b; --land-stroke: #3f3f3b; --sea: #14181c;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70;
    --accent: #3987e5; --accent-ink: #86b6ef; --accent-soft: #1b2c44;
    --good-ink: #0ca30c; --crit-soft: #3a1d1c; --warn-soft: #3a2f14; --good-soft: #15301a;
    --shadow: none;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0d0d0d; --surface: #1a1a19; --surface-2: #222220; --raised: #242422;
  --ink: #f0efec; --ink2: #c3c2b7; --muted: #9c9a92;
  --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,.10); --border-strong: rgba(255,255,255,.18);
  --land: #2e2e2b; --land-stroke: #3f3f3b; --sea: #14181c;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70;
  --accent: #3987e5; --accent-ink: #86b6ef; --accent-soft: #1b2c44;
  --good-ink: #0ca30c; --crit-soft: #3a1d1c; --warn-soft: #3a2f14; --good-soft: #15301a;
  --shadow: none;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--page); color: var(--ink); font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
a { color: var(--accent-ink); text-decoration: none; }
a:hover { text-decoration: underline; }
button { font: inherit; color: inherit; cursor: pointer; }
.mono { font-family: var(--mono); font-size: 12.5px; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.ink2 { color: var(--ink2); }
.small { font-size: 12.5px; }

/* Header */
header { position: sticky; top: 0; z-index: 20; background: color-mix(in srgb, var(--page) 88%, transparent); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-bottom: 1px solid var(--border); }
.hbar { max-width: 1320px; margin: 0 auto; padding: 12px 20px 0; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 650; font-size: 16px; letter-spacing: -.01em; }
.brand .logo { width: 26px; height: 26px; border-radius: 7px; background: var(--accent); display: grid; place-items: center; }
.brand small { font-weight: 500; color: var(--muted); font-size: 13px; }
.hright { margin-left: auto; display: flex; align-items: center; gap: 10px; }
.synced { font-size: 12.5px; color: var(--ink2); text-align: right; line-height: 1.3; }
.synced b { color: var(--ink); font-weight: 600; }
.btn { display: inline-flex; align-items: center; gap: 7px; height: 34px; padding: 0 14px; border-radius: 8px; border: 1px solid var(--border-strong); background: var(--surface); font-weight: 550; font-size: 13.5px; }
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--accent); border-color: transparent; color: #fff; }
.btn.primary:hover { filter: brightness(1.08); }
.btn:disabled { opacity: .6; cursor: default; }
.btn.icon { width: 34px; padding: 0; justify-content: center; }
.split { display: inline-flex; position: relative; }
.split .btn.primary:first-child { border-radius: 8px 0 0 8px; }
.split .btn.primary.caret { border-radius: 0 8px 8px 0; width: 30px; padding: 0; justify-content: center; border-left: 1px solid rgba(255,255,255,.25); }
.menu { position: absolute; right: 0; top: 40px; min-width: 250px; background: var(--raised); border: 1px solid var(--border-strong); border-radius: 10px; box-shadow: 0 8px 30px rgba(0,0,0,.18); padding: 6px; display: none; z-index: 30; }
.menu.open { display: block; }
.menu button { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 8px 10px; border-radius: 6px; }
.menu button:hover { background: var(--surface-2); }
.menu button small { display: block; color: var(--muted); font-size: 12px; }
.menu hr { border: 0; border-top: 1px solid var(--border); margin: 6px 4px; }
.spin { width: 14px; height: 14px; border-radius: 50%; border: 2px solid rgba(255,255,255,.4); border-top-color: #fff; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
nav { max-width: 1320px; margin: 0 auto; padding: 6px 20px 0; display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; }
nav a { padding: 9px 12px 10px; color: var(--ink2); border-bottom: 2px solid transparent; white-space: nowrap; font-size: 13.5px; font-weight: 500; }
nav a:hover { color: var(--ink); text-decoration: none; }
nav a.on { color: var(--ink); border-color: var(--accent); font-weight: 600; }
nav a .n { display: inline-block; min-width: 18px; padding: 0 5px; margin-left: 5px; border-radius: 9px; font-size: 11px; line-height: 17px; text-align: center; background: var(--surface-2); color: var(--ink2); border: 1px solid var(--border); }
nav a .n.crit { background: var(--crit); color: #fff; border-color: transparent; }
nav a .n.warn { background: var(--warn); color: #1c1c1a; border-color: transparent; }

main { max-width: 1320px; margin: 0 auto; padding: 20px 20px 60px; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px 18px; box-shadow: var(--shadow); min-width: 0; }
.card h3 { margin: 0 0 2px; font-size: 14px; font-weight: 620; }
.card .sub { color: var(--muted); font-size: 12.5px; margin-bottom: 10px; }
.ch { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
.ch h3 { margin: 0; }
.ch .right { margin-left: auto; font-size: 12.5px; color: var(--muted); }
h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 30px 0 10px; font-weight: 600; }
h2:first-child { margin-top: 0; }
.grid { display: grid; gap: 14px; }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.g-map { grid-template-columns: minmax(0, 1.45fr) minmax(0, 1fr); align-items: start; }
.g-servers { grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); }
.g-sites { grid-template-columns: repeat(auto-fill, minmax(380px, 1fr)); }

/* KPI tiles */
.tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin-bottom: 14px; }
.tile { padding: 14px 16px; }
.tile .k { font-size: 12.5px; color: var(--ink2); display: flex; align-items: center; gap: 6px; }
.tile .v { font-size: 26px; font-weight: 650; letter-spacing: -.02em; line-height: 1.2; margin-top: 4px; }
.tile .v span { font-size: 14px; font-weight: 500; color: var(--ink2); letter-spacing: 0; }
.tile .note { font-size: 12px; color: var(--muted); margin-top: 3px; }
.tile .bar { height: 6px; border-radius: 3px; background: var(--surface-2); margin-top: 8px; overflow: hidden; border: 1px solid var(--border); }
.tile .bar i { display: block; height: 100%; background: var(--accent); border-radius: 3px; }

/* Status */
.dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; flex: none; }
.dot.good { background: var(--good); } .dot.warn { background: var(--warn); } .dot.serious { background: var(--serious); } .dot.crit { background: var(--crit); } .dot.muted { background: var(--axis); }
.sev { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; white-space: nowrap; }
.sev i { width: 16px; height: 16px; border-radius: 50%; display: inline-grid; place-items: center; font-style: normal; font-size: 10.5px; font-weight: 800; color: #fff; }
.sev.high i { background: var(--crit); } .sev.medium i { background: var(--warn); color: #1c1c1a; }
.sev.low i { background: transparent; border: 1.5px solid var(--muted); color: var(--muted); } .sev.info i { background: var(--surface-2); border: 1px solid var(--border-strong); color: var(--ink2); }
.chip { display: inline-flex; align-items: center; gap: 5px; padding: 1px 8px; border-radius: 999px; font-size: 11.5px; font-weight: 550; background: var(--surface-2); color: var(--ink2); border: 1px solid var(--border); white-space: nowrap; }
.chip.good { background: var(--good-soft); color: var(--good-ink); border-color: transparent; }
.chip.bad { background: var(--crit-soft); color: var(--crit); border-color: transparent; }
.chip.warn { background: var(--warn-soft); color: var(--ink); border-color: transparent; }
.chip.accent { background: var(--accent-soft); color: var(--accent-ink); border-color: transparent; }
.chip.new { background: var(--accent); color: #fff; border-color: transparent; }

/* Server cards */
.srv { cursor: pointer; transition: border-color .15s, transform .15s; display: flex; flex-direction: column; gap: 10px; }
.srv:hover { border-color: var(--border-strong); }
.srv .top { display: flex; align-items: center; gap: 8px; }
.srv .name { font-weight: 650; font-size: 15px; }
.srv .top .chip { margin-left: auto; }
.srv .meta { font-size: 12.5px; color: var(--ink2); margin-top: -6px; }
.srv .role { font-size: 12.5px; color: var(--muted); margin-top: -6px; }
.meter { display: grid; grid-template-columns: 40px minmax(40px, 1fr) minmax(100px, auto); align-items: center; gap: 8px; font-size: 12.5px; }
.meter .lbl { color: var(--ink2); }
.meter .track { height: 8px; border-radius: 4px; background: var(--surface-2); overflow: hidden; border: 1px solid var(--border); }
.meter .track i { display: block; height: 100%; border-radius: 4px; background: var(--accent); min-width: 2px; }
.meter .track i.warn { background: var(--warn); } .meter .track i.crit { background: var(--crit); }
.meter .val { text-align: right; font-variant-numeric: tabular-nums; color: var(--ink2); white-space: nowrap; }
.meter .val b { color: var(--ink); font-weight: 600; }
.srv .foot { display: flex; flex-wrap: wrap; gap: 6px; border-top: 1px solid var(--border); padding-top: 10px; }
.spark-wrap { margin: -2px 0 -4px; }
.spark-label { display: flex; justify-content: space-between; font-size: 11.5px; color: var(--muted); }

/* Tables */
.tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
.tbl th { text-align: left; font-weight: 550; color: var(--muted); font-size: 12px; padding: 6px 10px 6px 0; border-bottom: 1px solid var(--border); white-space: nowrap; }
.tbl td { padding: 7px 10px 7px 0; border-bottom: 1px solid var(--border); vertical-align: top; }
.tbl tr:last-child td { border-bottom: 0; }
.tbl td.r, .tbl th.r { text-align: right; }
.tw { overflow-x: auto; }
.tbl .chip { white-space: normal; border-radius: 9px; }

/* Posture matrix */
.matrix { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 12.5px; }
.matrix th { font-weight: 550; color: var(--muted); font-size: 11.5px; text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--border); white-space: nowrap; }
.matrix td { padding: 8px; border-bottom: 1px solid var(--border); white-space: nowrap; }
.matrix td:first-child { font-weight: 600; position: sticky; left: 0; background: var(--surface); }
.cell { display: inline-flex; align-items: center; gap: 6px; }

/* Findings */
.finding { display: grid; grid-template-columns: 92px 1fr auto; gap: 4px 14px; padding: 11px 0; border-top: 1px solid var(--border); }
.finding:first-child { border-top: 0; }
.finding .t { font-weight: 600; }
.finding .d { color: var(--ink2); font-size: 13px; }
.finding .fix { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
.finding .fix code { font-family: var(--mono); font-size: 12px; color: var(--ink2); background: var(--surface-2); padding: 0 4px; border-radius: 4px; }
.finding .side { text-align: right; font-size: 12px; color: var(--muted); white-space: nowrap; }
.filters { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 12px; }
.fbtn { border: 1px solid var(--border-strong); background: var(--surface); border-radius: 999px; padding: 4px 11px; font-size: 12.5px; display: inline-flex; align-items: center; gap: 6px; }
.fbtn.on { background: var(--ink); color: var(--page); border-color: var(--ink); }
select { font: inherit; font-size: 12.5px; padding: 4px 8px; border-radius: 8px; border: 1px solid var(--border-strong); background: var(--surface); color: var(--ink); }

/* Map & topology */
.map svg, .topo svg { display: block; width: 100%; height: auto; }
.map .sea { fill: var(--sea); }
.map .land { fill: var(--land); stroke: var(--land-stroke); stroke-width: .6; }
.map .arc { fill: none; stroke: var(--accent); stroke-width: 1.6; stroke-dasharray: 4 4; opacity: .8; }
.map .lbl { font-size: 13px; font-weight: 600; fill: var(--ink); paint-order: stroke; stroke: var(--surface); stroke-width: 4px; stroke-linejoin: round; }
.map .lbl2 { font-size: 11.5px; fill: var(--ink2); paint-order: stroke; stroke: var(--surface); stroke-width: 4px; stroke-linejoin: round; }
.map .inset-bg { fill: var(--surface); stroke: var(--border-strong); }
.topo .node rect { fill: var(--surface-2); stroke: var(--border-strong); }
.topo .node.you rect { fill: var(--accent-soft); stroke: var(--accent); }
.topo .node.net rect { fill: none; stroke: var(--axis); stroke-dasharray: 4 3; }
.topo .node .n1 { font-size: 15px; font-weight: 650; fill: var(--ink); }
.topo .node .n2 { font-size: 12.5px; fill: var(--muted); font-family: var(--mono); }
.topo .link { fill: none; stroke: var(--axis); stroke-width: 1.6; }
.topo .link.ssh { stroke: var(--accent); }
.topo .link.priv { stroke: var(--s3); stroke-dasharray: 5 4; }
.topo .link.web { stroke: var(--axis); stroke-dasharray: 2 3; }
.topo .ll { font-size: 12.5px; fill: var(--ink2); paint-order: stroke; stroke: var(--surface); stroke-width: 4px; }

/* Charts */
.chart { position: relative; width: 100%; }
.chart svg { display: block; overflow: visible; }
.chart .gridl { stroke: var(--grid); stroke-width: 1; }
.chart .base { stroke: var(--axis); stroke-width: 1; }
.chart .tick { font-size: 11px; fill: var(--muted); font-variant-numeric: tabular-nums; }
.chart .xh { stroke: var(--axis); stroke-width: 1; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--ink2); margin-bottom: 6px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 14px; height: 3px; border-radius: 2px; display: inline-block; }
.tip { position: fixed; z-index: 50; pointer-events: none; background: var(--raised); border: 1px solid var(--border-strong); border-radius: 8px; padding: 7px 10px; font-size: 12px; box-shadow: 0 6px 24px rgba(0,0,0,.18); display: none; min-width: 120px; }
.tip .tt { color: var(--muted); margin-bottom: 3px; }
.tip .row { display: flex; align-items: center; gap: 7px; justify-content: space-between; }
.tip .row span { display: inline-flex; align-items: center; gap: 6px; color: var(--ink2); }
.tip .row b { font-variant-numeric: tabular-nums; font-weight: 600; }
.tip i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }

/* Sites */
.site .head { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
.site .head .d { font-weight: 650; font-size: 15px; }
.site .head .chip { margin-left: auto; }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin: 10px 0; }
.stat .k { font-size: 11.5px; color: var(--muted); }
.stat .v { font-size: 19px; font-weight: 650; letter-spacing: -.01em; }
.stat .dl { font-size: 11.5px; font-weight: 600; }
.up { color: var(--good-ink); } .down { color: var(--crit); }
.urls { display: grid; gap: 4px; margin: 6px 0 10px; }
.urls div { display: flex; align-items: center; gap: 7px; font-size: 12.5px; }
.urls .u { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--ink2); }
.urls > div { min-width: 0; }
.urls .ms { flex: none; margin-left: auto; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
details { border-top: 1px solid var(--border); padding-top: 8px; margin-top: 8px; }
summary { cursor: pointer; font-size: 12.5px; color: var(--ink2); font-weight: 550; }

/* Drawer */
.scrim { position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 40; display: none; }
.scrim.open { display: block; }
.mbars { display: grid; gap: 7px; }
.mb { display: grid; grid-template-columns: 230px minmax(60px, 1fr) 210px; gap: 10px; align-items: center; font-size: 12.5px; }
.mb .mn { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mb .mt { display: flex; gap: 2px; height: 10px; }
.mb .mt i { display: block; height: 100%; border-radius: 3px; min-width: 0; }
.mb .mv { text-align: right; white-space: nowrap; }
.topram { font-size: 12px; color: var(--ink2); margin-top: -4px; }
.topram b { color: var(--ink); font-weight: 600; }
@media (max-width: 720px) { .mb { grid-template-columns: 1fr; gap: 3px; } .mb .mv { text-align: left; } }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(860px, 100vw); background: var(--page); z-index: 41; transform: translateX(100%); transition: transform .22s ease; overflow-y: auto; border-left: 1px solid var(--border-strong); }
.drawer.open { transform: none; }
.drawer .dh { position: sticky; top: 0; background: var(--page); z-index: 2; padding: 16px 20px 12px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 10px; }
.drawer .dh h2 { margin: 0; font-size: 18px; text-transform: none; letter-spacing: -.01em; color: var(--ink); }
.drawer .db { padding: 18px 20px 40px; display: grid; gap: 14px; }

/* Sync log */
.synclog { max-width: 1320px; margin: 0 auto; padding: 0 20px; display: none; }
.synclog.open { display: block; }
.synclog .card { margin-top: 14px; padding: 12px 16px; }
.steps { display: flex; flex-wrap: wrap; gap: 6px 8px; }
.step { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; padding: 3px 10px 3px 8px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--border); }
.step .s { width: 14px; height: 14px; border-radius: 50%; display: inline-grid; place-items: center; font-size: 9px; font-weight: 800; color: #fff; }
.step.ok .s { background: var(--good); } .step.fail .s { background: var(--crit); } .step.warn .s { background: var(--warn); color: #1c1c1a; }
.step.skip .s { background: var(--axis); } .step.run .s { border: 2px solid var(--axis); border-top-color: var(--accent); animation: spin .8s linear infinite; }
.step[title] { cursor: help; }

.empty { text-align: center; padding: 60px 20px; color: var(--ink2); }
.empty h3 { font-size: 18px; margin: 0 0 6px; color: var(--ink); }
.callout { border: 1px dashed var(--border-strong); border-radius: 10px; padding: 12px 14px; font-size: 13px; color: var(--ink2); background: var(--surface-2); }
.callout b { color: var(--ink); }
code { font-family: var(--mono); font-size: 12px; }
.kv { display: grid; grid-template-columns: 150px 1fr; gap: 5px 12px; font-size: 13px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }

/* Verdict banner */
.verdict { display: flex; gap: 16px; align-items: flex-start; padding: 18px 20px; margin-bottom: 14px; border-left: 4px solid var(--good); }
.verdict.warn { border-left-color: var(--warn); } .verdict.crit { border-left-color: var(--crit); }
.verdict .vi { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; flex: none; color: #fff; font-weight: 800; font-size: 17px; background: var(--good); }
.verdict.warn .vi { background: var(--warn); color: #1c1c1a; } .verdict.crit .vi { background: var(--crit); }
.verdict .vh { font-size: 19px; font-weight: 650; letter-spacing: -.01em; line-height: 1.3; }

<body>
<header>

    <div class="brand">

        <button class="btn primary caret" id="syncMore" aria-label="More sync options"><svg width="10" height="10" viewBox="0 0 10 10"><path d="M2 3.5l3 3 3-3" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round"/></svg></button>

</header>
<div class="synclog" id="synclog"><div class="card"><div class="ch" style="margin-bottom:8px"><h3 id="syncTitle">Syncing</h3><span class="right" id="syncClose"></span></div><div class="steps" id="steps"></div></div></div>
<main id="main"><div class="empty"><h3>Loading…</h3></div></main>

<script src="vendor/d3.min.js"></script>
<script src="vendor/topojson-client.min.js"></script>
<script>
"use strict";
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
let S = null, WORLD = null, TAB = "overview", FIND = { sev: "all", scope: "all" }, CHARTS = [], DRAWER = null;

// ---------------------------------------------------------------- formatting
const GiB = 2 ** 30, TiB = 2 ** 40;
const fmtGB = b => b == null ? "–" : (b / GiB >= 100 ? (b / GiB).toFixed(0) : (b / GiB).toFixed(1)) + " GB";
const gbPair = (a, b) => `${fmtGB(a).replace(" GB", "")}/${fmtGB(b)}`;
const fmtBytes = b => b == null ? "–" : b >= TiB ? (b / TiB).toFixed(2) + " TB" : b >= GiB ? (b / GiB).toFixed(1) + " GB" : b >= 2 ** 20 ? (b / 2 ** 20).toFixed(0) + " MB" : (b / 1024).toFixed(0) + " KB";
const fmtRate = b => b == null ? "–" : b >= 2 ** 20 ? (b / 2 ** 20).toFixed(1) + " MB/s" : b >= 1024 ? (b / 1024).toFixed(0) + " KB/s" : b.toFixed(0) + " B/s";
const fmtInt = n => n == null ? "–" : Math.round(n).toLocaleString("en-US");
const fmtEur = n => n == null ? "–" : "€" + n.toFixed(2);
const pct = (a, b) => b ? 100 * a / b : 0;
const fmtDur = s => { if (s == null) return "–"; const d = Math.floor(s / 86400); if (d >= 1) return d + "d"; const h = Math.floor(s / 3600); return h >= 1 ? h + "h" : Math.floor(s / 60) + "m"; };
const parseT = t => t ? new Date(t.replace(" ", "T") + (/[zZ]|[+-]\d\d:?\d\d$/.test(t) ? "" : "Z")) : null;
function ago(t) {
  const d = parseT(t); if (!d) return "never";
  const s = (Date.now() - d) / 1000;
  if (s < 60) return "just now"; if (s < 3600) return Math.floor(s / 60) + " min ago";
  if (s < 86400) return Math.floor(s / 3600) + " h ago"; return Math.floor(s / 86400) + " d ago";
}
const fmtDate = t => { const d = parseT(t); return d ? d.toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric" }) : "–"; };
const fmtDT = t => { const d = parseT(t); return d ? d.toLocaleString("en-GB", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" }) : "–"; };
const sum = (arr, f = x => x) => arr.reduce((a, x) => a + (f(x) || 0), 0);
const modeName = m => m === "full" ? "full sync" : m === "api-only" ? "without SSH" : m?.startsWith("host:") ? "re-check " + m.slice(5) : "partial sync";
const SEVNAME = { high: "High", medium: "Medium", low: "Low", info: "Info" };
const sevIcon = s => `<span class="sev ${s}"><i>${s === "high" || s === "medium" ? "!" : s === "low" ? "•" : "i"}</i>${SEVNAME[s]}</span>`;
const FLAG = { DE: "🇩🇪", US: "🇺🇸", FI: "🇫🇮", SG: "🇸🇬" };

// ---------------------------------------------------------------- derived data
const openF = () => (S.findings || []).filter(f => !f.ack);
const findingsFor = scope => openF().filter(f => f.scope === scope);
// A "problem" = something wrong right now at high/medium severity. Everything else (incl. low health items) is "to tidy".
const isProblem = f => f.kind === "health" && (f.severity === "high" || f.severity === "medium");
const isTidy = f => !isProblem(f) && f.severity !== "info";
const problemsFor = scope => findingsFor(scope).filter(isProblem);
const tidyFor = scope => findingsFor(scope).filter(isTidy);
function health(scope) {
  const f = problemsFor(scope);
  if (f.some(x => x.severity === "high")) return "crit";
  if (f.some(x => x.severity === "medium")) return "warn";
  return "good";
}
// Health = is it OK right now. Setup items (backups off, SSH passwords …) never colour the dot.
function serverHealth(s) { return s.status !== "running" ? "crit" : (s.vitals && !s.vitals.ok ? "warn" : health(s.name)); }
const HEALTH_LABEL = { good: "Healthy", warn: "Watch", crit: "Problem" };
const hoursSince = t => { const d = parseT(t); return d ? (Date.now() - d) / 36e5 : Infinity; };
let PREV_VISIT = null;
try { PREV_VISIT = localStorage.getItem("infra-last-visit"); localStorage.setItem("infra-last-visit", new Date().toISOString()); } catch (e) { }
function memPct(v) { return v && v.mem_total ? pct(v.mem_total - v.mem_available, v.mem_total) : null; }
function lastCpu(s) {
  const m = (s.metrics || []).filter(r => r[1] != null); if (!m.length) return null;
  const tail = m.slice(-2); return sum(tail, r => r[1]) / tail.length / (s.cores || 1);
}
function fwFor(s) { return (S.firewalls || []).filter(f => s.firewall_ids.includes(f.hetzner_id)); }
function portRules(rules, port) {
  const src = [];
  for (const r of rules) {
    if (r.direction !== "in" || !["tcp", "any"].includes(r.protocol)) continue;
    let hit = false; const p = r.port;
    if (p == null || p === "any") hit = true;
    else if (String(p).includes("-")) { const [a, b] = String(p).split("-").map(Number); hit = port >= a && port <= b; }
    else hit = Number(p) === port;
    if (hit) src.push(...(r.source_ips || []));
  }
  return src;
}
function portExposure(s, port) {
  const fws = fwFor(s);
  if (!s.ipv4) return { k: "private", label: "private network only" };
  if (!fws.length) return { k: "open", label: "no cloud firewall" };
  const src = portRules(fws.flatMap(f => f.rules), port);
  if (src.some(x => x === "0.0.0.0/0" || x === "::/0")) return { k: "world", label: "open to the internet" };
  if (src.length) return { k: "restricted", label: "allowed from " + src.map(ipName).join(", ") };
  return { k: "blocked", label: "blocked by Hetzner firewall" };
}
function ipName(cidr) {
  const ip = cidr.replace(/\/32$/, "");
  if (cidr === "0.0.0.0/0") return "anywhere (IPv4)"; if (cidr === "::/0") return "anywhere (IPv6)";
  const s = (S.servers || []).find(x => x.ipv4 === ip); return s ? `${s.name}` : ip;
}
const cost = () => (S.resources || {}).cost || null;

// ---------------------------------------------------------------- charts
function chart(fn, cls = "") { const id = CHARTS.length; CHARTS.push(fn); return `<div class="chart ${cls}" data-chart="${id}"></div>`; }
function drawCharts(root = document) {
  root.querySelectorAll("[data-chart]").forEach(el => { const fn = CHARTS[+el.dataset.chart]; if (fn) { el.innerHTML = ""; fn(el, el.clientWidth || 300); } });
}
const tip = $("#tip");
function showTip(html, ev) {
  tip.innerHTML = html; tip.style.display = "block";
  const r = tip.getBoundingClientRect(); let x = ev.clientX + 14, y = ev.clientY + 14;
  if (x + r.width > innerWidth - 8) x = ev.clientX - r.width - 14;
  if (y + r.height > innerHeight - 8) y = ev.clientY - r.height - 14;
  tip.style.left = x + "px"; tip.style.top = y + "px";
}
const hideTip = () => { tip.style.display = "none"; };

/* Line chart. series: [{name, color, pts: [[Date|ms, value], ...]}] */
function lineChart(el, w, { series, h = 150, fmt = v => v, yMax, compact = false, area = false, dateOnly = false }) {
  series = series.filter(s => s.pts.length);
  if (!series.length) { el.innerHTML = `<div class="muted small" style="padding:${compact ? 4 : 20}px 0">No data yet</div>`; return; }
  const m = compact ? { t: 4, r: 2, b: 4, l: 2 } : { t: 10, r: 10, b: 22, l: 46 };
  const all = series.flatMap(s => s.pts);
  const x = d3.scaleTime().domain(d3.extent(all, p => p[0])).range([m.l, w - m.r]);
  const ymax = yMax ?? (d3.max(all, p => p[1]) || 1);
  const y = d3.scaleLinear().domain([0, ymax]).nice(compact ? 2 : 4).range([h - m.b, m.t]);
  const svg = d3.select(el).append("svg").attr("width", w).attr("height", h);
  if (!compact) {
    svg.append("g").selectAll("line").data(y.ticks(4)).join("line").attr("class", d => d === 0 ? "base" : "gridl")
      .attr("x1", m.l).attr("x2", w - m.r).attr("y1", d => y(d) + .5).attr("y2", d => y(d) + .5);
    svg.append("g").selectAll("text").data(y.ticks(4)).join("text").attr("class", "tick").attr("x", m.l - 8).attr("y", d => y(d) + 4)
      .attr("text-anchor", "end").text(d => fmt(d, true));
    const xt = x.ticks(Math.max(2, Math.min(6, Math.floor(w / 110))));
    svg.append("g").selectAll("text").data(xt).join("text").attr("class", "tick").attr("x", d => x(d)).attr("y", h - 5)
      .attr("text-anchor", "middle").text(d => dateOnly || (x.domain()[1] - x.domain()[0]) > 3 * 864e5 ? d3.timeFormat("%b %-d")(d) : d3.timeFormat("%H:%M")(d));
  } else {
    svg.append("line").attr("class", "base").attr("x1", m.l).attr("x2", w - m.r).attr("y1", h - m.b + .5).attr("y2", h - m.b + .5);
  }
  const line = d3.line().defined(p => p[1] != null).x(p => x(p[0])).y(p => y(p[1])).curve(d3.curveMonotoneX);
  if (area && series.length === 1) {
    const a = d3.area().defined(p => p[1] != null).x(p => x(p[0])).y0(y(0)).y1(p => y(p[1])).curve(d3.curveMonotoneX);
    svg.append("path").attr("d", a(series[0].pts)).attr("fill", series[0].color).attr("opacity", .12);
  }
  series.forEach(s => svg.append("path").attr("d", line(s.pts)).attr("fill", "none").attr("stroke", s.color)
    .attr("stroke-width", compact ? 1.6 : 2).attr("stroke-linejoin", "round").attr("stroke-linecap", "round"));
  // hover: crosshair + dots + tooltip
  const xh = svg.append("line").attr("class", "xh").attr("y1", m.t).attr("y2", h - m.b).style("display", "none");
  const dots = series.map(s => svg.append("circle").attr("r", 4).attr("fill", s.color).attr("stroke", css("--surface")).attr("stroke-width", 2).style("display", "none"));
  const bis = d3.bisector(p => p[0]).center;
  svg.append("rect").attr("x", m.l).attr("y", 0).attr("width", Math.max(0, w - m.l - m.r)).attr("height", h).attr("fill", "transparent")
    .on("pointermove pointerdown", ev => {
      const t = x.invert(d3.pointer(ev)[0]);
      const rows = series.map((s, i) => { const p = s.pts[bis(s.pts, t)]; return { s, p, i }; });
      const ref = rows[0].p; if (!ref) return;
      xh.style("display", null).attr("x1", x(ref[0])).attr("x2", x(ref[0]));
      rows.forEach(r => r.p && r.p[1] != null ? dots[r.i].style("display", null).attr("cx", x(r.p[0])).attr("cy", y(r.p[1])) : dots[r.i].style("display", "none"));
      const tf = dateOnly ? d3.timeFormat("%a %b %-d") : d3.timeFormat("%b %-d, %H:%M");
      showTip(`<div class="tt">${tf(ref[0])}</div>` + rows.map(r => `<div class="row"><span><i style="background:${r.s.color}"></i>${esc(r.s.name)}</span><b>${r.p && r.p[1] != null ? esc(fmt(r.p[1])) : "–"}</b></div>`).join(""), ev);
    })
    .on("pointerleave", () => { xh.style("display", "none"); dots.forEach(d => d.style("display", "none")); hideTip(); });
}
const legend = items => `<div class="legend">${items.map(([n, c]) => `<span><i style="background:${c}"></i>${esc(n)}</span>`).join("")}</div>`;
// Hetzner CPU is summed over cores (800% = 8 busy vCPUs); shown as % of all vCPUs.
const metricPts = (s, i, scale = i === 1 ? 1 / (s.cores || 1) : 1) => (s.metrics || []).map(r => [new Date(r[0] * 1000), r[i] == null ? null : r[i] * scale]);
const peak = pts => Math.max(0, ...pts.map(p => p[1] ?? 0));
const dailyPts = arr => (arr || []).map(([d, v]) => [new Date(d + "T12:00:00"), v]);

// ---------------------------------------------------------------- map
async function loadWorld() {
  if (WORLD) return WORLD;
  try { const topo = await (await fetch("vendor/countries-110m.json")).json(); WORLD = topojson.feature(topo, topo.objects.countries); WORLD.features = WORLD.features.filter(f => f.id !== "010"); }
  catch (e) { WORLD = { type: "FeatureCollection", features: [] }; }
  return WORLD;
}
function drawMap(el) {
  const W = 960, H = 470;
  const servers = (S.servers || []).filter(s => s.lat != null && s.lon != null);
  if (!servers.length) { el.innerHTML = `<div class="muted small" style="padding:20px 0">Add <code>lat</code>/<code>lon</code> (or use the Hetzner API) to place servers on the map.</div>`; return; }
  const hc = { good: css("--good"), warn: css("--warn"), crit: css("--crit") };
  const locs = d3.groups(servers, s => `${(+s.lat).toFixed(1)},${(+s.lon).toFixed(1)}`).map(([k, list]) => ({ list, lat: +list[0].lat, lon: +list[0].lon,
    city: list[0].city || list[0].location || "", health: list.map(serverHealth).includes("crit") ? "crit" : list.map(serverHealth).includes("warn") ? "warn" : "good" }));
  // Fit the view to the servers, with room around them (so one or two locations don't fill the whole map).
  const lons = locs.map(l => l.lon), lats = locs.map(l => l.lat);
  const pad = Math.max(12, (Math.max(...lons) - Math.min(...lons)) * 0.25, (Math.max(...lats) - Math.min(...lats)) * 0.35);
  const box = [[Math.max(-179, Math.min(...lons) - pad * 1.6), Math.max(-58, Math.min(...lats) - pad)], [Math.min(179, Math.max(...lons) + pad * 1.6), Math.min(75, Math.max(...lats) + pad)]];
  const proj = d3.geoMercator().fitExtent([[20, 20], [W - 20, H - 20]], { type: "MultiPoint", coordinates: box });
  const path = d3.geoPath(proj);
  const svg = d3.select(el).append("svg").attr("viewBox", `0 0 ${W} ${H}`).attr("role", "img").attr("aria-label", "Map of server locations");
  svg.append("rect").attr("class", "sea").attr("width", W).attr("height", H).attr("rx", 8);
  svg.append("g").selectAll("path").data(WORLD.features).join("path").attr("class", "land").attr("d", path);
  const jump = S.config.jump_host && (S.servers || []).find(s => s.cfg.ssh === S.config.jump_host && s.lat != null);
  if (jump) locs.filter(l => !l.list.includes(jump)).forEach(l => svg.append("path").attr("class", "arc").attr("d", path({ type: "LineString", coordinates: [[+jump.lon, +jump.lat], [l.lon, l.lat]] })));
  const placed = [];
  locs.map(l => ({ ...l, p: proj([l.lon, l.lat]) })).sort((a, b) => a.p[1] - b.p[1]).forEach(l => {
    const [px, py] = l.p;
    svg.append("circle").attr("cx", px).attr("cy", py).attr("r", 8).attr("fill", hc[l.health]).attr("stroke", css("--surface")).attr("stroke-width", 2.5);
    let ly = py;   // push the label down while it would overlap an earlier one

function drawTopology(el) {
  const servers = S.servers || [], byName = Object.fromEntries(servers.map(s => [s.name, s]));
  const ME = "you", NET = "internet", hc = { good: css("--good"), warn: css("--warn"), crit: css("--crit") };
  const alias = n => (n === "mac" || n === "laptop" || n === "you") ? ME : n;
  let links = (S.links || []).map(([a, b, label]) => [alias(a), alias(b), label || ""]).filter(([a, b]) => (a === ME || byName[a]) && (b === ME || byName[b]));
  if (!links.length) links = servers.filter(s => s.cfg.ssh).map(s => [ME, s.name, "SSH"]);
  // Columns = hops from this machine.
  const depth = { [ME]: 0 }, q = [ME];
  while (q.length) { const n = q.shift(); links.filter(l => l[0] === n).forEach(([, b]) => { if (depth[b] == null) { depth[b] = depth[n] + 1; q.push(b); } }); }
  servers.forEach(s => { if (depth[s.name] == null) depth[s.name] = 1; });
  // Public ports per server (Hetzner firewall rules; servers without them get no internet edge).
  const pub = {};
  servers.forEach(s => {
    const rules = fwFor(s).flatMap(f => f.rules).filter(r => r.direction === "in");
    if (!s.ipv4 || !rules.length) return;
    const any = r => (r.source_ips || []).some(x => x === "0.0.0.0/0" || x === "::/0");
    const sshOk = (S.config.ssh_world_ok || []).includes(s.name);
    const world = [...new Set(rules.filter(any).map(r => r.port))].filter(p => p !== "22" || sshOk);
    const listed = [...new Set(rules.filter(r => !any(r)).map(r => r.port))].filter(p => p !== "22");
    const label = world.length ? world.sort().join(", ") + " open" : listed.length ? listed.join(", ") + " (listed IPs)" : "";
    if (label) pub[s.name] = label;
  });
  const maxD = Math.max(1, ...Object.values(depth)), cols = maxD + (Object.keys(pub).length ? 2 : 1);
  const bw = 176, bh = 58, gapY = 34, W = Math.max(760, cols * (bw + 90)), colW = (W - bw - 20) / Math.max(1, cols - 1);
  const byCol = d3.groups(Object.keys(depth), n => depth[n]);
  const rows = Math.max(...byCol.map(([, ns]) => ns.length), 1), H = rows * (bh + gapY) + 20;
  const pos = {};
  byCol.forEach(([d, ns]) => ns.sort((a, b) => ((byName[a]?.cfg.order ?? 99) - (byName[b]?.cfg.order ?? 99))).forEach((n, i) => {
    pos[n] = [10 + d * colW, (H - ns.length * (bh + gapY) + gapY) / 2 + i * (bh + gapY)]; }));
  if (Object.keys(pub).length) pos[NET] = [10 + (cols - 1) * colW, H / 2 - bh / 2];
  const svg = d3.select(el).append("svg").attr("viewBox", `0 0 ${W} ${H}`).attr("role", "img").attr("aria-label", "How the servers connect");
  const curve = (a, b, cls, label, dy = 0) => {
    const [ax, ay] = pos[a], [bx, by] = pos[b];
    const x1 = ax + bw, y1 = ay + bh / 2 + dy, x2 = bx, y2 = by + bh / 2, mx = (x1 + x2) / 2;
    svg.append("path").attr("class", "link " + cls).attr("d", `M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}`);
    if (label) svg.append("text").attr("class", "ll").attr("x", x1 + 8).attr("y", y1 - 6).text(label);
  };
  links.forEach(([a, b, label]) => curve(a, b, /priv|10\.|172\.|192\.168/i.test(label) ? "priv" : "ssh", label));
  Object.entries(pub).forEach(([n, label]) => curve(n, NET, "web", label, 8));
  const node = (key, t1, t2, cls, h) => {
    const [x, y] = pos[key];
    const g = svg.append("g").attr("class", "node " + cls).style("cursor", byName[key] ? "pointer" : "default");
    g.append("rect").attr("x", x).attr("y", y).attr("width", bw).attr("height", bh).attr("rx", 9);
    if (h) g.append("circle").attr("cx", x + 16).attr("cy", y + 21).attr("r", 5).attr("fill", hc[h]);
    g.append("text").attr("class", "n1").attr("x", x + (h ? 29 : 14)).attr("y", y + 26).text(t1);
    g.append("text").attr("class", "n2").attr("x", x + 14).attr("y", y + 45).text(t2);
    if (byName[key]) g.on("click", () => openServer(key));
  };
  node(ME, "This machine", "sync.py · ssh", "you");
  if (pos[NET]) node(NET, "Internet", "public ports", "net");
  servers.forEach(s => node(s.name, s.name, s.ipv4 || (s.private_ips || [])[0] || s.cfg.ssh || "", "", serverHealth(s)));
}

  $("#main").innerHTML = view();
  const m = $("[data-map]"); if (m) loadWorld().then(() => { m.innerHTML = ""; drawMap(m); });
  const t = $("[data-topo]"); if (t) drawTopology(t);
  drawCharts($("#main"));
  document.querySelectorAll("#main [data-server]").forEach(el => { el.onclick = () => openServer(el.dataset.server); el.onkeydown = e => { if (e.key === "Enter") openServer(el.dataset.server); }; });
  document.querySelectorAll("#main [data-open]").forEach(el => el.onclick = e => { e.preventDefault(); openServer(el.dataset.open); });
  document.querySelectorAll("[data-sev]").forEach(el => el.onclick = () => { FIND.sev = el.dataset.sev; render(); });
  document.querySelectorAll("[data-tlf]").forEach(el => el.onclick = () => { TLF = el.dataset.tlf; render(); });
  const sel = $("#scopeSel"); if (sel) sel.onchange = () => { FIND.scope = sel.value; render(); };
  wireFindings($("#main"));
  const nf = $("#noteForm"); if (nf) nf.onsubmit = async e => {
    e.preventDefault(); const fd = new FormData(nf);
    await post("/api/event", { title: fd.get("title"), scope: fd.get("scope"), kind: fd.get("kind") }); await load();
  };
}
async function load() {
  try { S = await (await fetch("/api/state")).json(); }
  catch (e) { $("#main").innerHTML = `<div class="card empty"><h3>Can't reach the local server</h3><p>Start it with <code>python3 serve.py --open</code> in the infra-dashboard folder.</p></div>`; return; }
  render();
  if (DRAWER) openServer(DRAWER, true);
  if (S.sync_running) pollSync();
}
function parseHash() {
  const [tab, srv] = location.hash.slice(1).split("/");
  return { tab: TABS.some(t => t[0] === tab) ? tab : "sites", srv: srv ? decodeURIComponent(srv) : null };
}
function route() {
  const { tab, srv } = parseHash();
  const tabChanged = tab !== TAB; TAB = tab;
  if (S && tabChanged) { render(); scrollTo(0, 0); }
  if (S && srv) openServer(srv, true); else if (DRAWER) closeDrawer(true);
}
addEventListener("hashchange", route);
let rz; addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(() => { drawCharts(); }, 150); });

// ---------------------------------------------------------------- sync
const menu = $("#syncMenu");
function buildMenu() {
  menu.innerHTML = `<button data-m="full">Full sync<small>Hetzner API, SSH check of every box (one at a time), sites, Google, App Store</small></button>
    <button data-m="api-only">Without SSH<small>Hetzner API, sites, Google, App Store — about 1 minute</small></button><hr>
    ${(S?.servers || []).map(s => `<button data-m="host" data-h="${esc(s.name)}">Re-check ${esc(s.name)}<small>API + SSH of this box only</small></button>`).join("")}`;
  menu.querySelectorAll("button").forEach(b => b.onclick = () => { menu.classList.remove("open"); startSync(b.dataset.m, b.dataset.h); });
}
$("#syncMore").onclick = e => { e.stopPropagation(); buildMenu(); menu.classList.toggle("open"); };
document.addEventListener("click", e => { if (!menu.contains(e.target)) menu.classList.remove("open"); });
$("#syncBtn").onclick = () => startSync("full");
async function startSync(mode, host) {
  const r = await fetch("/api/sync", { method: "POST", headers: { "Content-Type": "application/json", "X-Infra-Dashboard": "1" }, body: JSON.stringify({ mode, host }) });
  const j = await r.json();
  if (!r.ok && r.status !== 409) { alertLog(j.error || "Could not start sync"); return; }
  pollSync();
}
function alertLog(msg) { $("#synclog").classList.add("open"); $("#syncTitle").textContent = msg; $("#steps").innerHTML = ""; }
let polling = false;
async function pollSync() {
  if (polling) return; polling = true;
  const btn = $("#syncBtn"); btn.disabled = true; btn.innerHTML = `<span class="spin"></span><span>Syncing…</span>`;
  $("#synclog").classList.add("open");
  let st;
  do {
    try { st = await (await fetch("/api/sync/status")).json(); } catch (e) { break; }
    const steps = []; const seen = {};
    for (const e of st.steps) { if (e.step === "Sync") continue; if (seen[e.step] != null) steps[seen[e.step]] = e; else { seen[e.step] = steps.length; steps.push(e); } }
    $("#syncTitle").textContent = st.running ? `Syncing (${st.mode === "api-only" ? "without SSH" : st.mode === "host" ? "one server" : "full"})…` : `Sync finished`;
    $("#steps").innerHTML = steps.map(e => `<span class="step ${e.state}" title="${esc(e.detail)}"><span class="s">${{ ok: "✓", fail: "✕", warn: "!", skip: "–" }[e.state] || ""}</span>${esc(e.step)}${e.state === "ok" && e.detail ? ` <span class="muted">· ${esc(e.detail.length > 46 ? e.detail.slice(0, 46) + "…" : e.detail)}</span>` : ""}</span>`).join("");
    const bad = steps.filter(e => e.state === "fail" || e.state === "warn");
    $("#steps").insertAdjacentHTML("afterend", "");
    let se = $("#syncerr"); if (!se) { $("#steps").insertAdjacentHTML("afterend", '<div class="syncerr" id="syncerr"></div>'); se = $("#syncerr"); }
    se.innerHTML = bad.map(e => `<div><b>${esc(e.step)}:</b> ${esc(e.detail)}</div>`).join("");
    if (st.running) await new Promise(r => setTimeout(r, 1000));
  } while (st && st.running);
  polling = false;
  btn.disabled = false; btn.innerHTML = `<svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M13.5 6.5A5.5 5.5 0 0 0 3.2 4.6M2.5 9.5a5.5 5.5 0 0 0 10.3 1.9"/><path d="M3 1.8v3h3M13 14.2v-3h-3"/></svg><span>Sync</span>`;
  $("#syncClose").innerHTML = `<a href="#" id="hideLog">Hide</a>`;
  $("#hideLog").onclick = e => { e.preventDefault(); $("#synclog").classList.remove("open"); };
  await load();
}

// ---------------------------------------------------------------- theme
function applyTheme(t) { if (t) document.documentElement.dataset.theme = t; else delete document.documentElement.dataset.theme; }
try { applyTheme(localStorage.getItem("infra-theme")); } catch (e) { }
$("#theme").onclick = () => {
  const dark = document.documentElement.dataset.theme ? document.documentElement.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  const next = dark ? "light" : "dark"; applyTheme(next);
  try { localStorage.setItem("infra-theme", next); } catch (e) { }
  if (S) render(); if (DRAWER) openServer(DRAWER, true);
};

TAB = parseHash().tab;
load().then(() => { const { srv } = parseHash(); if (srv) openServer(srv, true); });
setInterval(() => { if (!polling && S) { const el = $("#synced"); if (el && S.last_sync) render(); } }, 60000);
</script>
</body>
</html>
